version: "3.8"

# =====================================================
# BRAND CLUB - PRODUCTION STACK
# =====================================================
# Branch: main
# Stack: brandclub-prod
# Image: brand_club:main
# Purpose: Live production environment
# Features: High availability, daily backups, monitoring
# =====================================================

services:
  # ===== Backend Service (Gunicorn) =====
  backend:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

    environment:
      # Redis Configuration
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      
      # Database Configuration
      DB_HOST: mariadb
      DB_PORT: 3306
      
      # Frappe Configuration
      FRAPPE_SITE_NAME_HEADER: $$host
      SOCKETIO_PORT: 9000
      
      # Production Settings
      FRAPPE_LOGGING_LEVEL: WARNING
      GUNICORN_WORKERS: 4
      GUNICORN_TIMEOUT: 120
      
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb
      - shared-services


  # ===== Frontend Service (Nginx) =====
  frontend:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure

      labels:
        # Traefik Configuration
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.constraint-label=traefik-public
        
        # HTTP Router (redirect to HTTPS)
        - traefik.http.routers.brandclub-prod-http.rule=Host(`${PROD_DOMAIN:-brandclub.com}`)
        - traefik.http.routers.brandclub-prod-http.entrypoints=http
        - traefik.http.routers.brandclub-prod-http.middlewares=https-redirect
        
        # HTTPS Router
        - traefik.http.routers.brandclub-prod-https.rule=Host(`${PROD_DOMAIN:-brandclub.com}`)
        - traefik.http.routers.brandclub-prod-https.entrypoints=https
        - traefik.http.routers.brandclub-prod-https.tls=true
        - traefik.http.routers.brandclub-prod-https.tls.certresolver=le
        
        # Service definition
        - traefik.http.services.brandclub-prod.loadbalancer.server.port=8080
        - traefik.http.services.brandclub-prod.loadbalancer.sticky.cookie=true
        - traefik.http.services.brandclub-prod.loadbalancer.sticky.cookie.name=brandclub_lb
        
        # Security headers
        - traefik.http.middlewares.prod-security.headers.stsSeconds=31536000
        - traefik.http.middlewares.prod-security.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.prod-security.headers.stsPreload=true
        - traefik.http.middlewares.prod-security.headers.frameDeny=true
        - traefik.http.middlewares.prod-security.headers.contentTypeNosniff=true
        - traefik.http.middlewares.prod-security.headers.browserXssFilter=true
        - traefik.http.routers.brandclub-prod-https.middlewares=prod-security
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: $$host
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - traefik-public
    depends_on:
      - backend
      - websocket

  # ===== WebSocket Service =====
  websocket:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure
 
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network

  # ===== Queue Workers =====
  queue-default:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure

    command:
      - bench
      - worker
      - --queue
      - default
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  queue-short:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure
 
    command:
      - bench
      - worker
      - --queue
      - short
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  queue-long:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure
 
    command:
      - bench
      - worker
      - --queue
      - long
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  # ===== Scheduler Service =====
  scheduler:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    command:
      - bench
      - schedule
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  # ===== Backup Service (Scheduled via Ofelia) =====
  backup:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager
      labels:
        ofelia.enabled: "true"
        ofelia.job-run.brandclub-backup.schedule: "* * * * *"
        ofelia.job-run.brandclub-backup.container: "brandclub-main_backup"
        ofelia.job-run.brandclub-backup.no-overlap: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "=== Brand Club Backup Service Started ==="
        
        PROD_SITE="${PROD_DOMAIN:-erp.brandclub.site}"
        BACKUP_DIR="/backups/$${PROD_SITE}"
        mkdir -p "$${BACKUP_DIR}"
        
        echo "Starting backup at $$(date)"
        
        # Run bench backup for the site
        cd /home/frappe/frappe-bench
        bench --site $${PROD_SITE} backup --with-files || {
          echo "ERROR: Backup failed at $$(date)" >&2
          exit 1
        }
        
        # Copy Frappe's backup files to /backups mount
        FRAPPE_BACKUP_DIR="/home/frappe/frappe-bench/sites/$${PROD_SITE}/private/backups"
        if [ -d "$${FRAPPE_BACKUP_DIR}" ]; then
          LATEST_BACKUP=$$(ls -t "$${FRAPPE_BACKUP_DIR}" | grep database | head -1)
          if [ ! -z "$${LATEST_BACKUP}" ]; then
            TIMESTAMP=$${LATEST_BACKUP%-database*}
            echo "Copying backup ($${TIMESTAMP}) to $${BACKUP_DIR}..."
            mkdir -p "$${BACKUP_DIR}"
            cp "$${FRAPPE_BACKUP_DIR}"/$${TIMESTAMP}-* "$${BACKUP_DIR}/" 2>/dev/null || true
          fi
        fi
        
        # Cleanup - keep only last 7 backups
        echo "Cleaning up old backups (keeping last 7)..."
        cd "$${BACKUP_DIR}" 2>/dev/null || exit 0
        ls -t *-database* 2>/dev/null | tail -n +8 | while read old_db; do
          BACKUP_PREFIX=$${old_db%-database*}
          echo "Removing old backup: $${BACKUP_PREFIX}"
          rm -f $${BACKUP_PREFIX}-* || true
        done || true
        
        echo "Current backups:"
        ls -lh "$${BACKUP_DIR}" | grep -E "database|config" | tail -10 || echo "No backups found"
        
        echo "=== Backup completed successfully at $$(date) ==="
        exit 0
    environment:
      PROD_SITE: ${PROD_SITE:-erp.brandclub.site}
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - backups:/backups
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  # ===== Migration Service =====
  migration:
    image: ghcr.io/brandclub/brand-club-erp:${TAG_NAME:-main}
    deploy:
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager
    entrypoint: ["bash", "-c"]
    command:
      - |
        bench --site all set-config -p maintenance_mode 1
        bench --site all set-config -p pause_scheduler 1
        bench --site all migrate
        bench --site all set-config -p maintenance_mode 0
        bench --site all set-config -p pause_scheduler 0
    environment:
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      DB_HOST: mariadb
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - brandclub-prod-network
      - brandclub-prod-mariadb

  # ===== Redis Cache Service =====
  redis-cache:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-cache-data:/data
    networks:
      - brandclub-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Redis Queue Service =====
  redis-queue:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-queue-data:/data
    networks:
      - brandclub-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===== Volumes =====
volumes:
  sites:
    name: brandclub-prod-sites
  logs:
    name: brandclub-prod-logs
  redis-cache-data:
    name: brandclub-prod-redis-cache
  redis-queue-data:
    name: brandclub-prod-redis-queue
  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DIR:-/backups}
    name: brandclub-prod-backups

# ===== Networks =====
networks:
  # Internal network for Frappe services (created by this stack)
  brandclub-prod-network:
    external: false
    name: brandclub-prod-network
    driver: overlay
    attachable: true

  # Isolated database network (created by database-prod stack)
  brandclub-prod-mariadb:
    external: true
    name: brandclub-prod-mariadb

  # Shared Traefik network (must be created externally)
  traefik-public:
    external: true
    name: traefik-public

  # Shared services network (for future mail relay, etc.)
  shared-services:
    external: true
    name: shared-services

# =====================================================
# ENVIRONMENT VARIABLES REQUIRED (set in Portainer)
# =====================================================
# PROD_DOMAIN=erp.brandclub.site
# MAILPIT_DOMAIN=mailpit.erp.brandclub.site
# CLIENT_MAX_BODY_SIZE=50m
# TAG_NAME=main (optional, defaults to 'main' if not set)