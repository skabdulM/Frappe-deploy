[global]
save-folder = /var/log/ofelia
save-only-on-error = false

[job-exec "brandclub-prod-backup"]
schedule = 0 2 * * *
container = brandclub-prod_backend.1
command = /bin/bash -c 'set -e && echo "=== Brand Club Backup Service Started ===" && PROD_SITE="erp.brandclub.site" && BACKUP_DIR="/backups/$${PROD_SITE}" && mkdir -p "$${BACKUP_DIR}" && echo "Starting backup at $(date)" && cd /home/frappe/frappe-bench && bench --site $${PROD_SITE} backup --with-files || { echo "ERROR: Backup failed at $(date)" >&2; exit 1; } && FRAPPE_BACKUP_DIR="/home/frappe/frappe-bench/sites/$${PROD_SITE}/private/backups" && if [ -d "$${FRAPPE_BACKUP_DIR}" ]; then LATEST_BACKUP=$(ls -t "$${FRAPPE_BACKUP_DIR}" | grep database | head -1); if [ ! -z "$${LATEST_BACKUP}" ]; then TIMESTAMP=$${LATEST_BACKUP%-database*}; echo "Copying backup ($${TIMESTAMP}) to $${BACKUP_DIR}..."; mkdir -p "$${BACKUP_DIR}"; cp "$${FRAPPE_BACKUP_DIR}"/$${TIMESTAMP}-* "$${BACKUP_DIR}/" 2>/dev/null || true; fi; fi && echo "Cleaning up old backups (keeping last 7)..." && cd "$${BACKUP_DIR}" 2>/dev/null || exit 0 && ls -t *-database* 2>/dev/null | tail -n +8 | while read old_db; do BACKUP_PREFIX=$${old_db%-database*}; echo "Removing old backup: $${BACKUP_PREFIX}"; rm -f $${BACKUP_PREFIX}-* || true; done || true && echo "Current backups:" && ls -lh "$${BACKUP_DIR}" | grep -E "database|config" | tail -10 || echo "No backups found" && echo "=== Backup completed successfully at $(date) ===" && exit 0'
no-overlap = true
