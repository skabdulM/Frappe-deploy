version: "3.8"
# ── Traefik reverse-proxy + automatic SSL ─────────────────────────────────────
# Managed by deploy-vps.py — do not edit manually.
# Version: __TRAEFIK_VERSION__
# Dashboard: https://__TRAEFIK_DOMAIN__
# ─────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    image: traefik:__TRAEFIK_VERSION__
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.middlewares.admin-auth.basicauth.users=admin:__TRAEFIK_HASHED_PW__"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
        - "traefik.http.routers.traefik-http.rule=Host(`__TRAEFIK_DOMAIN__`)"
        - "traefik.http.routers.traefik-http.entrypoints=http"
        - "traefik.http.routers.traefik-http.middlewares=https-redirect"
        - "traefik.http.routers.traefik-https.rule=Host(`__TRAEFIK_DOMAIN__`)"
        - "traefik.http.routers.traefik-https.entrypoints=https"
        - "traefik.http.routers.traefik-https.tls=true"
        - "traefik.http.routers.traefik-https.tls.certresolver=le"
        - "traefik.http.routers.traefik-https.service=api@internal"
        - "traefik.http.routers.traefik-https.middlewares=admin-auth"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.constraints=Label(`traefik.constraint-label`,`traefik-public`)
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=__TRAEFIK_EMAIL__
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog
      - --api
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    networks:
      - traefik-public

volumes:
  traefik-certificates:
    name: traefik-certificates

networks:
  traefik-public:
    external: true
    name: traefik-public